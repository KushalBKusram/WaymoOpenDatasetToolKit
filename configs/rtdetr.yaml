# RT-DETR-L (Ultralytics): a COCO-pretrained transformer detector, fine-tuned on Waymo FRONT camera.
name: rtdetr_l
task: camera_2d_detection

model:
  type: RTDETRDetector
  variant: l           # l | x
  num_classes: 4
  class_names: [vehicle, pedestrian, cyclist, sign]

data:
  split: training
  cameras: [1]
  img_size: 512
  max_frames_per_seg: null
  manifest: configs/benchmark_splits.json
  frame_stride: 1
  num_workers: 3               # parallel batch building; speed only, results are unchanged

train:
  device: auto
  seed: 42
  total_segs: 20
  passes: 10                   # passes over all training segments (shuffled each pass)
  epochs_per_seg: 1            # epochs each time a segment is visited
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 10.0
  save_every: 5

eval:
  segs: 10
  conf: 0.25
  iou: 0.45
